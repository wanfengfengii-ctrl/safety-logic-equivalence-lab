# 联锁门图等价性复算工作台 —— 纯前端静态站点 + 一次性验收服务
#
#   docker compose build
#   WEB_PORT=8080 docker compose up -d web      # 静态页面（端口可覆盖）
#   docker compose run --rm verify              # 一次性验收：vitest + build + playwright
#
services:
  web:
    build:
      context: .
      target: web
    image: interlock-workbench-web
    ports:
      # 宿主机端口由 WEB_PORT 覆盖，默认 8080；容器内固定 8080
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: interlock-workbench-verify
    environment:
      # Playwright 容器内访问 web 服务
      BASE_URL: http://web:8080
    depends_on:
      web:
        condition: service_healthy
    # 一次性服务：跑完即退出；不重启
    restart: "no"
