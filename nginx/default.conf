server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 纯静态、无后端；前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
